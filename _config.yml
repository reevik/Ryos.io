url: 'https://ryos.io'
baseurl: '/'
permalink: pretty
title: 'ryos.io'

logo:
  # 2x assets rendered at half size, so the lockup stays sharp on retina.
  mobile: "images/logo/ryos-mark.png"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/ryos-logo.png"
  desktop_height: "32px"
  desktop_width: "100px"

home: 
  limit_services: 6

collections:
  # Both collections hold Serif's demo content (accounting services, fictional
  # staff). Not output while ryos.io is in coming-soon mode — and they should
  # not come back as they are: advertising services and people that don't
  # exist is misleading.
  services:
    output: false
    sort_by: weight
  team:
    output: false

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - netlify.toml
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
