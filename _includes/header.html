<div class='header'>
  <div class="container">
    <a class="logo" href="{{ site.baseurl }}">
      <img width="{{ site.logo.desktop_width }}" height="{{ site.logo.desktop_height }}"
           alt="{{ site.title }}" src="{{ site.logo.desktop | relative_url }}" />
    </a>
    <a class="logo-mobile" href="{{ site.baseurl }}">
      <img width="{{ site.logo.mobile_width }}" height="{{ site.logo.mobile_height }}"
           alt="{{ site.title }}" src="{{ site.logo.mobile | relative_url }}" />
    </a>
    {% include main-menu.html %}
    {% include hamburger.html %}
  </div>
</div>
